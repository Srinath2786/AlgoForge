spring:
  application:
    name: coding-platform-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/coding_platform
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial schema"
    validate-on-migrate: false
    out-of-order: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:platform-super-secret-key-please-change-me-in-prod-min-256-bits}
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

execution:
  docker:
    enabled: ${DOCKER_EXECUTION_ENABLED:true}
    memory-limit: 512m
    cpu-timeout-seconds: 5
    network-disabled: true
    images:
      java: eclipse-temurin:17-jdk
      python: python:3.11-slim
      cpp: gcc:latest
      javascript: node:20-slim
  rate-limit:
    max-submissions-per-minute: 5

logging:
  level:
    com.codingplatform: INFO
