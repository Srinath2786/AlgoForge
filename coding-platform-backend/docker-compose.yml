services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coding_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coding_platform
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET:-platform-super-secret-key-please-change-me-in-prod-min-256-bits}
      DOCKER_EXECUTION_ENABLED: "true"
    ports:
      - "8080:8080"
    # Required so the backend container can launch sibling sandbox
    # containers on the host's Docker daemon (Docker-outside-of-Docker).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
